<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050508"/>
      <stop offset="100%" stop-color="#0d0b18"/>
    </linearGradient>
    <radialGradient id="orb1" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#8b7cf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8b7cf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="80%" cy="70%" r="35%">
      <stop offset="0%" stop-color="#00e5b8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00e5b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b7cf8"/>
      <stop offset="100%" stop-color="#00e5b8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#orb1)"/>
  <rect width="1200" height="630" fill="url(#orb2)"/>

  <!-- Score ring (right side) -->
  <g transform="translate(880, 315)">
    <circle cx="0" cy="0" r="140" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="16"/>
    <circle cx="0" cy="0" r="140" fill="none" stroke="url(#ring-grad)" stroke-width="16"
      stroke-dasharray="703" stroke-dashoffset="141"
      stroke-linecap="round" transform="rotate(-90)"/>
    <text x="0" y="8" font-family="Georgia,serif" font-style="italic" font-size="72"
      fill="white" text-anchor="middle" dominant-baseline="middle">85</text>
    <text x="0" y="54" font-family="Arial,sans-serif" font-size="18"
      fill="rgba(255,255,255,0.5)" text-anchor="middle">匹配度</text>
  </g>

  <!-- Left content -->
  <!-- Kicker -->
  <rect x="80" y="160" width="120" height="28" rx="14"
    fill="rgba(139,124,248,0.15)" stroke="rgba(139,124,248,0.4)" stroke-width="1"/>
  <text x="140" y="178" font-family="Arial,sans-serif" font-size="13" font-weight="600"
    fill="#8b7cf8" text-anchor="middle" letter-spacing="1">AI POWERED</text>

  <!-- Title -->
  <text x="80" y="260" font-family="Georgia,serif" font-style="italic" font-size="72"
    fill="white" font-weight="400">HarnessJob</text>

  <!-- Subtitle -->
  <text x="80" y="318" font-family="Arial,sans-serif" font-size="26"
    fill="rgba(255,255,255,0.65)" font-weight="300">AI 职位匹配分析</text>

  <!-- Divider -->
  <line x1="80" y1="355" x2="480" y2="355" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Feature pills -->
  <g transform="translate(80, 378)">
    <rect width="110" height="30" rx="15" fill="rgba(139,124,248,0.12)" stroke="rgba(139,124,248,0.3)" stroke-width="1"/>
    <text x="55" y="19" font-family="Arial,sans-serif" font-size="13" fill="rgba(255,255,255,0.7)" text-anchor="middle">技能 × 0.5</text>
  </g>
  <g transform="translate(202, 378)">
    <rect width="116" height="30" rx="15" fill="rgba(0,229,184,0.08)" stroke="rgba(0,229,184,0.25)" stroke-width="1"/>
    <text x="58" y="19" font-family="Arial,sans-serif" font-size="13" fill="rgba(255,255,255,0.7)" text-anchor="middle">经验 × 0.3</text>
  </g>
  <g transform="translate(330, 378)">
    <rect width="116" height="30" rx="15" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="58" y="19" font-family="Arial,sans-serif" font-size="13" fill="rgba(255,255,255,0.7)" text-anchor="middle">学历 × 0.2</text>
  </g>

  <!-- Domain -->
  <text x="80" y="480" font-family="Arial,sans-serif" font-size="20"
    fill="rgba(255,255,255,0.3)" font-weight="300">harnessjob.com</text>
</svg>
